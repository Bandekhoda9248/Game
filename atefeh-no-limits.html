<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#1a0b2e"/>
<title>ATEFEH NO LIMITS — 3D Runner</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#12081f;touch-action:none;
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;
 color:#fff;text-align:center;background-size:cover;background-position:center 30%}
.ov.nofoto{background:
 radial-gradient(60% 40% at 15% 30%,#3f5a35 0%,transparent 60%),
 radial-gradient(50% 35% at 88% 32%,#37522f 0%,transparent 60%),
 repeating-linear-gradient(90deg,#8a6a3a 0 6px,#6d5330 6px 12px),
 linear-gradient(#c9b28a,#b7a077)}
.ov:before{content:'';position:absolute;inset:0;background:linear-gradient(rgba(18,8,31,.55),rgba(18,8,31,.88))}
.ov>*{position:relative}
#menu h1{font-size:clamp(34px,9vw,72px);margin:0;font-weight:900;letter-spacing:.06em;font-style:italic;
 background:linear-gradient(90deg,#ff5fa2,#ffd76a,#5fd0ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
 filter:drop-shadow(0 4px 18px rgba(255,95,162,.45))}
#menu .tag{font-size:13px;letter-spacing:.35em;opacity:.85;margin:6px 0 2px}
#menu .badge{display:inline-block;margin:10px auto;padding:8px 22px;border-radius:30px;font-weight:800;letter-spacing:.15em;
 background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(10px);font-size:14px}
.stats{display:flex;gap:12px;margin:14px 0}
.pill{padding:10px 20px;border-radius:16px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
 backdrop-filter:blur(12px);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.btn{margin:6px;padding:16px 46px;border-radius:30px;border:none;font-size:17px;font-weight:900;letter-spacing:.12em;cursor:pointer;
 color:#fff;background:linear-gradient(90deg,#ff2f7e,#ff7a3d);box-shadow:0 10px 30px rgba(255,47,126,.45);transition:transform .12s}
.btn:active{transform:scale(.94)}
.btn.alt{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);box-shadow:none;backdrop-filter:blur(12px)}
#menu .free{margin-top:16px;font-size:11px;letter-spacing:.25em;opacity:.7}
#hud{position:fixed;z-index:15;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;display:none;
 justify-content:space-between;padding:0 16px;color:#fff;pointer-events:none}
#hud .s{font:900 22px monospace;text-shadow:0 2px 8px #000;font-variant-numeric:tabular-nums}
#hud .c{font:800 17px monospace;color:#ffd76a;text-shadow:0 2px 8px #000}
#btnPause{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.3);
 background:rgba(0,0,0,.35);backdrop-filter:blur(8px);color:#fff;font-size:17px}
#pows{position:fixed;z-index:15;top:calc(env(safe-area-inset-top,0px) + 64px);left:16px;display:none;gap:8px}
#pows div{padding:6px 12px;border-radius:14px;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);font:800 13px monospace;color:#5fd0ff}
#shop{display:none;z-index:30;background:rgba(18,8,31,.96)}
#shop h2{font-size:30px;font-weight:900;font-style:italic;margin:0 0 4px;letter-spacing:.08em;color:#ffd76a}
#shopList{width:min(430px,92vw);max-height:52vh;overflow:auto;padding:4px}
.item{display:flex;align-items:center;gap:12px;margin:10px 0;padding:14px;border-radius:18px;
 background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(10px);text-align:left}
.item .ic{font-size:34px}
.item .tx{flex:1;color:#fff}
.item .tx b{display:block;font-size:15px}
.item .tx span{font-size:11px;opacity:.7}
.item button{padding:10px 16px;border-radius:14px;border:none;font-weight:900;font-size:13px;cursor:pointer;color:#fff;
 background:linear-gradient(90deg,#ff2f7e,#ff7a3d)}
.item button:disabled{background:rgba(255,255,255,.15);color:rgba(255,255,255,.5)}
.item button.own{background:rgba(95,208,255,.25);color:#5fd0ff}
#over{display:none;z-index:30;background:rgba(18,8,31,.9)}
#over h2{font-size:clamp(36px,10vw,64px);font-weight:900;font-style:italic;margin:0;color:#ff5fa2;text-shadow:0 4px 24px rgba(255,95,162,.5)}
#pause{display:none;z-index:30;background:rgba(18,8,31,.85)}
.big{font:900 26px monospace;color:#ffd76a;margin:8px}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud"><div><div class="s" id="sc">0</div><div class="c">🪙 <span id="cn">0</span></div></div>
 <button id="btnPause">⏸</button></div>
<div id="pows"></div>

<div class="ov" id="menu">
 <h1>ATEFEH<br>NO LIMITS</h1>
 <div class="tag">3D ENDLESS RUNNER</div>
 <div class="badge">‍♀️ CHARACTER: ATEFEH</div>
 <div class="stats"><div class="pill">🏆 <span id="mBest">0</span></div><div class="pill">🪙 <span id="mCoins">0</span></div></div>
 <button class="btn" id="bPlay">▶ PLAY</button>
 <button class="btn alt" id="bShop">🛍 SHOP</button>
 <div class="pill" id="eng" style="margin-top:12px">⏳ در حال دانلود موتور بازی…</div>
 <div class="free">100% FREE · NO ADS · SWIPE TO RUN</div>
</div>

<div class="ov" id="shop">
 <h2>🛍 SHOP</h2>
 <div class="pill" style="margin-bottom:8px">🪙 <span id="sCoins">0</span></div>
 <div id="shopList"></div>
 <button class="btn alt" id="bBack">← BACK</button>
</div>

<div class="ov" id="over">
 <h2>GAME OVER</h2>
 <div class="big">⭐ <span id="oScore">0</span></div>
 <div class="pill">🪙 +<span id="oCoins">0</span></div>
 <div class="pill" style="margin-top:8px">🏆 BEST: <span id="oBest">0</span></div>
 <button class="btn" id="bRetry">↻ RETRY</button>
 <button class="btn alt" id="bRevive" style="display:none">💖 REVIVE (1)</button>
 <button class="btn alt" id="bMenu">🏠 MENU</button>
</div>

<div class="ov" id="pause">
 <h2 style="font-style:italic;font-weight:900">PAUSED</h2>
 <button class="btn" id="bResume">▶ RESUME</button>
 <button class="btn alt" id="bQuit">🏠 MENU</button>
</div>

<script>
function bootGame(){'use strict';
document.getElementById('eng').style.display='none';
const rand=(a,b)=>a+Math.random()*(b-a),irand=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const isTouch=matchMedia('(pointer:coarse)').matches||'ontouchstart'in window;
let bank=+(localStorage.getItem('anl_coins')||0),best=+(localStorage.getItem('anl_best')||0),
 owns=JSON.parse(localStorage.getItem('anl_own')||'{}');
const save=()=>{localStorage.setItem('anl_coins',bank);localStorage.setItem('anl_best',best);localStorage.setItem('anl_own',JSON.stringify(owns));};
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),antialias:!isTouch});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,isTouch?1.8:2));
renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x1a1026);scene.fog=new THREE.Fog(0x1a1026,30,95);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,200);
scene.add(new THREE.HemisphereLight(0xbfc8ff,0x2a2030,.9));
const dl=new THREE.DirectionalLight(0xfff0d8,.8);dl.position.set(4,10,6);scene.add(dl);
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
const floral=cv(128,128);{const g=floral.getContext('2d');g.fillStyle='#f4efe6';g.fillRect(0,0,128,128);
 for(let k=0;k<14;k++){const x=rand(8,120),y=rand(8,120),col=['#e8452a','#ff8c3a','#ffb347','#d92645'][irand(0,3)];
  g.fillStyle=col;for(let p=0;p<6;p++){const a=p/6*6.283;g.beginPath();g.ellipse(x+Math.cos(a)*7,y+Math.sin(a)*7,6,3.5,a,0,6.283);g.fill();}
  g.fillStyle='#5a1010';g.beginPath();g.arc(x,y,3,0,6.283);g.fill();
  g.strokeStyle='#20221c';g.lineWidth=2;g.beginPath();g.moveTo(x+8,y+6);g.quadraticCurveTo(x+16,y+10,x+20,y+18);g.stroke();}}
const floralTex=new THREE.CanvasTexture(floral);floralTex.encoding=THREE.sRGBEncoding;
const rail=cv(128,128);{const g=rail.getContext('2d');g.fillStyle='#3a3540';g.fillRect(0,0,128,128);
 g.fillStyle='#2a2530';for(let y=0;y<128;y+=16)g.fillRect(0,y,128,6);
 g.fillStyle='#6a6472';g.fillRect(30,0,8,128);g.fillRect(90,0,8,128);
 g.fillStyle='#8a8494';g.fillRect(32,0,3,128);g.fillRect(92,0,3,128);}
const railTex=new THREE.CanvasTexture(rail);railTex.wrapS=railTex.wrapT=THREE.RepeatWrapping;railTex.repeat.set(3,14);railTex.encoding=THREE.sRGBEncoding;
const wall=cv(256,64);{const g=wall.getContext('2d');g.fillStyle='#4a4054';g.fillRect(0,0,256,64);
 const cols=['#ff5fa2','#5fd0ff','#ffd76a','#7cff6b'];
 for(let k=0;k<8;k++){g.fillStyle=cols[irand(0,3)];g.font='bold '+irand(14,26)+'px Arial';g.fillText(['ATEFEH','NO LIMITS','RUN!','★'][irand(0,3)],rand(0,200),rand(20,54));}
 g.fillStyle='rgba(0,0,0,.3)';for(let x=0;x<256;x+=32)g.fillRect(x,0,3,64);}
const wallTex=new THREE.CanvasTexture(wall);wallTex.wrapS=wallTex.wrapT=THREE.RepeatWrapping;wallTex.repeat.set(6,1);wallTex.encoding=THREE.sRGBEncoding;
function trainTex(col){const c=cv(256,64);const g=c.getContext('2d');
 g.fillStyle=col;g.fillRect(0,0,256,64);
 g.fillStyle='rgba(0,0,0,.28)';g.fillRect(0,0,256,6);g.fillRect(0,58,256,6);
 g.fillStyle='#1a222c';g.fillRect(8,14,240,16);
 g.fillStyle='rgba(160,200,255,.28)';for(let x=8;x<248;x+=20)g.fillRect(x,14,6,16);
 g.fillStyle='rgba(0,0,0,.2)';g.fillRect(52,10,34,44);g.fillRect(170,10,34,44);
 g.fillStyle='#1a222c';g.fillRect(56,14,26,14);g.fillRect(174,14,26,14);
 g.fillStyle='rgba(255,255,255,.55)';g.fillRect(0,34,256,3);
 const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(9,140),new THREE.MeshStandardMaterial({map:railTex,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.position.z=-40;scene.add(ground);
const walls=[];for(const s of[-1,1]){const w=new THREE.Mesh(new THREE.BoxGeometry(.6,4,140),new THREE.MeshStandardMaterial({map:wallTex}));
 w.position.set(s*4.6,2,-40);scene.add(w);walls.push(w);}
const pillars=[];for(let i=0;i<10;i++){for(const s of[-1,1]){
 const p=new THREE.Mesh(new THREE.BoxGeometry(.5,4.4,.5),new THREE.MeshStandardMaterial({color:0x6a5a7a}));
 p.position.set(s*4.1,2.2,-i*14);scene.add(p);pillars.push(p);}}
const lamps=[];for(let i=0;i<8;i++){const l=new THREE.Mesh(new THREE.BoxGeometry(6,.15,.4),new THREE.MeshBasicMaterial({color:0xffe9b0}));
 l.position.set(0,4.3,-i*18);scene.add(l);lamps.push(l);}
/* ==== ATEFEH ==== */
const skin=new THREE.MeshStandardMaterial({color:0xc98d6b}),hairM=new THREE.MeshStandardMaterial({color:0x16121a,roughness:.6}),
 pantM=new THREE.MeshStandardMaterial({color:0x141416,roughness:.9}),flM=new THREE.MeshStandardMaterial({map:floralTex,roughness:.85}),
 bagM=new THREE.MeshStandardMaterial({color:0xc22a3d,roughness:.5}),sandM=new THREE.MeshStandardMaterial({color:0xe8a08a}),
 watchM=new THREE.MeshStandardMaterial({color:0x2a6ad9,roughness:.4}),goldM=new THREE.MeshStandardMaterial({color:0xffd76a,metalness:.8,roughness:.3});
const A=new THREE.Group();
const torso=new THREE.Mesh(new THREE.BoxGeometry(.5,.6,.28),flM);torso.position.y=1.06;
const hips=new THREE.Mesh(new THREE.BoxGeometry(.44,.2,.26),pantM);hips.position.y=.72;
const head=new THREE.Mesh(new THREE.SphereGeometry(.21,14,12),skin);head.position.y=1.53;
const hairG=new THREE.Group();hairG.position.y=1.53;
const cap=new THREE.Mesh(new THREE.SphereGeometry(.235,16,12,0,6.283,0,1.6),hairM);cap.position.y=.02;
const back1=new THREE.Mesh(new THREE.BoxGeometry(.3,.55,.12),hairM);back1.position.set(0,-.28,-.16);back1.rotation.x=.12;
const back2=new THREE.Mesh(new THREE.BoxGeometry(.36,.5,.1),hairM);back2.position.set(0,-.72,-.2);back2.rotation.x=.05;
const back3=new THREE.Mesh(new THREE.BoxGeometry(.3,.35,.08),hairM);back3.position.set(0,-1.05,-.22);back3.rotation.x=-.06;
const sideL=new THREE.Mesh(new THREE.BoxGeometry(.07,.42,.09),hairM);sideL.position.set(-.2,-.32,.03);
const sideR=new THREE.Mesh(new THREE.BoxGeometry(.07,.42,.09),hairM);sideR.position.set(.2,-.32,.03);
hairG.add(cap,back1,back2,back3,sideL,sideR);
const strap=new THREE.Mesh(new THREE.BoxGeometry(.07,.72,.05),bagM);strap.position.set(0,1.08,.16);strap.rotation.z=.5;
const bag=new THREE.Mesh(new THREE.BoxGeometry(.2,.24,.1),bagM);bag.position.set(.3,.82,.14);
const ear=new THREE.Mesh(new THREE.SphereGeometry(.03,6,6),goldM);ear.position.set(.2,1.5,.02);
const ear2=ear.clone();ear2.position.x=-.2;
function leg2(){const p=new THREE.Group();p.position.y=.66;
 const m=new THREE.Mesh(new THREE.BoxGeometry(.26,.5,.26),pantM);m.position.y=-.25;p.add(m);
 const fl=new THREE.Mesh(new THREE.BoxGeometry(.3,.24,.3),pantM);fl.position.y=-.58;p.add(fl);
 const f=new THREE.Mesh(new THREE.BoxGeometry(.11,.06,.24),sandM);f.position.set(0,-.68,.04);p.add(f);return p;}
function arm(){const p=new THREE.Group();p.position.y=1.3;
 const s=new THREE.Mesh(new THREE.BoxGeometry(.12,.3,.12),flM);s.position.y=-.15;p.add(s);
 const fa=new THREE.Mesh(new THREE.BoxGeometry(.1,.28,.1),skin);fa.position.y=-.44;p.add(fa);return p;}
const legL=leg2(),legR=leg2(),armL=arm(),armR=arm();
legL.position.x=-.14;legR.position.x=.14;armL.position.x=-.31;armR.position.x=.31;
const watch=new THREE.Mesh(new THREE.BoxGeometry(.12,.06,.12),watchM);watch.position.y=-.52;armL.add(watch);
const brace=new THREE.Mesh(new THREE.BoxGeometry(.11,.05,.11),goldM);brace.position.y=-.5;armR.add(brace);
[torso,hips,head,hairG,strap,bag,ear,ear2,legL,legR,armL,armR].forEach(m=>A.add(m));
const blob=new THREE.Mesh(new THREE.CircleGeometry(.5,16),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.35}));
blob.rotation.x=-Math.PI/2;blob.position.y=.02;A.add(blob);
scene.add(A);
/* ==== trains ==== */
const trainMats=['#ffc42e','#d94040','#3a6ad9','#4caf7d'].map(c=>new THREE.MeshStandardMaterial({map:trainTex(c),roughness:.45,metalness:.25}));
const roofM=new THREE.MeshStandardMaterial({color:0xd8d8e0,roughness:.6}),skirtM=new THREE.MeshStandardMaterial({color:0x2a2a30}),
 bumpM=new THREE.MeshStandardMaterial({color:0x555560}),tlM=new THREE.MeshStandardMaterial({color:0x551111,emissive:0xff2222,emissiveIntensity:1.2}),
 plateM=new THREE.MeshStandardMaterial({color:0xeeeeee});
const obs=[];for(let i=0;i<10;i++){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(2,2.2,14),trainMats[i%4]);body.position.y=1.4;
 const roof=new THREE.Mesh(new THREE.BoxGeometry(1.6,.3,13),roofM);roof.position.y=2.65;
 const skirt=new THREE.Mesh(new THREE.BoxGeometry(2.05,.5,14),skirtM);skirt.position.y=.35;
 const bump=new THREE.Mesh(new THREE.BoxGeometry(2.1,.35,.2),bumpM);bump.position.set(0,.6,7.05);
 const tl1=new THREE.Mesh(new THREE.BoxGeometry(.3,.25,.1),tlM);tl1.position.set(-.7,1.1,7.05);
 const tl2=new THREE.Mesh(new THREE.BoxGeometry(.3,.25,.1),tlM);tl2.position.set(.7,1.1,7.05);
 const plate=new THREE.Mesh(new THREE.BoxGeometry(.7,.3,.1),plateM);plate.position.set(0,1.15,7.05);
 g.add(body,roof,skirt,bump,tl1,tl2,plate);g.visible=false;scene.add(g);
 obs.push({g,len:14});}
const bars=[];for(let i=0;i<10;i++){
 const g=new THREE.Group();
 const low=new THREE.Mesh(new THREE.BoxGeometry(1.9,.9,.35),new THREE.MeshStandardMaterial({color:0xff8c3a}));low.position.y=.45;
 const hi=new THREE.Mesh(new THREE.BoxGeometry(1.9,.9,.35),new THREE.MeshStandardMaterial({color:0xff2f7e}));hi.position.y=1.75;
 g.add(low,hi);g.visible=false;scene.add(g);bars.push({g,low,hi,type:'low'});}
const CD=48,coinGeo=new THREE.CylinderGeometry(.42,.42,.08,12);coinGeo.rotateX(Math.PI/2);
const coins=new THREE.InstancedMesh(coinGeo,new THREE.MeshStandardMaterial({color:0xffc93c,emissive:0xaa7700,emissiveIntensity:.7,metalness:.8,roughness:.25}),CD);
coins.frustumCulled=false;scene.add(coins);
const cState=[];for(let i=0;i<CD;i++)cState.push({on:false,x:0,y:1,z:0,ph:rand(0,6)});
const pups=[];for(let i=0;i<3;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(.7,.7,.7),new THREE.MeshStandardMaterial({color:0x5fd0ff,emissive:0x2288aa,emissiveIntensity:.8}));
 m.visible=false;scene.add(m);pups.push({m,on:false,type:'magnet'});}
const dummy=new THREE.Object3D();
let AC=null;const audio=()=>{try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC&&AC.state==='suspended')AC.resume();}catch(e){}};
function tone(f0,f1,d,t,v){if(!AC)return;try{const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
 o.type=t;o.frequency.setValueAtTime(f0,n);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),n+d);
 g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d+.02);}catch(e){}}
let state='MENU',speed=0,dist=0,score=0,runCoins=0,lane=1,laneX=0,py=0,vy=0,jumping=false,slideT=0,
 spawnZ=0,pupZ=0,magnetT=0,shield=0,reviveUsed=false,ph=0,mult=1,lastFree=1;
const LANES=[-2.2,0,2.2];
const ITEMS=[
 {id:'magnet',ic:'🧲',n:'COIN MAGNET',d:'آهن‌ربای سکه در طول دو',c:400},
 {id:'x2',ic:'⭐',n:'SCORE x2',d:'امتیاز دوبرابر دائمی',c:600},
 {id:'hover',ic:'🛡',n:'SHIELD',d:'هر دو با ۱ سپر شروع می‌شه',c:800},
 {id:'revive',ic:'💖',n:'SECOND CHANCE',d:'یک بار زنده‌شدن در هر دو',c:1200}];
const $=id=>document.getElementById(id);
function updMenu(){$('mBest').textContent=best;$('mCoins').textContent=bank;}
function renderShop(){$('sCoins').textContent=bank;
 $('shopList').innerHTML=ITEMS.map(it=>`<div class="item"><div class="ic">${it.ic}</div>
  <div class="tx"><b>${it.n}</b><span>${it.d}</span></div>
  <button class="${owns[it.id]?'own':''}" data-id="${it.id}" ${owns[it.id]?'disabled':''}>${owns[it.id]?'OWNED':'🪙 '+it.c}</button></div>`).join('');
 [...$('shopList').querySelectorAll('button')].forEach(b=>b.onclick=()=>{const it=ITEMS.find(x=>x.id===b.dataset.id);
  if(!owns[it.id]&&bank>=it.c){bank-=it.c;owns[it.id]=1;save();tone(600,1200,.2,'sine',.3);renderShop();updMenu();}else tone(200,150,.15,'square',.2);});}
function show(id){['menu','shop','over','pause'].forEach(x=>$(x).style.display=x===id?'flex':'none');
 $('hud').style.display=id===''?'flex':'none';$('pows').style.display=id===''?'flex':'none';}
const BG_URL='';
{const src=BG_URL||'bg.jpg';const im=new Image();
 im.onerror=()=>$('menu').classList.add('nofoto');
 im.onload=()=>{$('menu').style.backgroundImage='url('+src+')';};
 im.src=src;}
function startRun(){state='PLAY';speed=13;dist=0;score=0;runCoins=0;lane=1;laneX=0;py=0;vy=0;jumping=false;slideT=0;
 spawnZ=-30;pupZ=-70;magnetT=0;reviveUsed=false;lastFree=1;
 shield=owns.hover?1:0;mult=owns.x2?2:1;
 obs.forEach(o=>o.g.visible=false);bars.forEach(b=>b.g.visible=false);pups.forEach(p=>p.m.visible=false);
 cState.forEach(c=>c.on=false);A.visible=true;A.rotation.set(0,0,0);A.position.set(0,0,0);
 hairG.rotation.set(0,0,0);
 show('');tone(400,800,.2,'sine',.25);}
function gameOver(){state='OVER';bank+=runCoins;if(score>best)best=score;save();updMenu();
 $('oScore').textContent=score;$('oCoins').textContent=runCoins;$('oBest').textContent=best;
 $('bRevive').style.display=owns.revive&&!reviveUsed?'inline-block':'none';
 show('over');tone(300,60,.6,'sawtooth',.35);}
function crash(){if(shield>0){shield--;tone(800,200,.3,'square',.3);
 obs.forEach(o=>{if(o.g.visible&&Math.abs(o.g.position.z)<6)o.g.position.z=-60;});
 bars.forEach(b=>{if(b.g.visible&&Math.abs(b.g.position.z)<4)b.g.position.z=-60;});return;}
 gameOver();}
function move(d){if(state!=='PLAY')return;lane=clamp(lane+d,0,2);tone(500,700,.06,'sine',.12);}
function jump(){if(state!=='PLAY'||jumping)return;vy=8.6;jumping=true;slideT=0;tone(300,600,.15,'sine',.2);}
function slide(){if(state!=='PLAY')return;if(jumping){vy=-14;}slideT=.65;tone(600,200,.15,'sine',.15);}
let tx0=0,ty0=0,tt0=0;
addEventListener('touchstart',e=>{if(e.target.closest('button,.ov'))return;const t=e.touches[0];tx0=t.clientX;ty0=t.clientY;tt0=performance.now();},{passive:true});
addEventListener('touchend',e=>{if(e.target.closest('button,.ov'))return;const t=e.changedTouches[0];
 const dx=t.clientX-tx0,dy=t.clientY-ty0;
 if(Math.hypot(dx,dy)<24&&performance.now()-tt0<250){jump();return;}
 if(Math.abs(dx)>Math.abs(dy)){move(dx>0?1:-1);}else{dy<0?jump():slide();}},{passive:true});
addEventListener('keydown',e=>{
 if(e.code==='ArrowLeft'||e.code==='KeyA')move(-1);
 if(e.code==='ArrowRight'||e.code==='KeyD')move(1);
 if(e.code==='ArrowUp'||e.code==='Space'||e.code==='KeyW')jump();
 if(e.code==='ArrowDown'||e.code==='KeyS')slide();});
document.addEventListener('gesturestart',e=>e.preventDefault());
$('bPlay').onclick=()=>{audio();startRun();};
$('bShop').onclick=()=>{audio();renderShop();show('shop');};
$('bBack').onclick=()=>show('menu');
$('bRetry').onclick=()=>startRun();
$('bMenu').onclick=()=>{show('menu');updMenu();};
$('bResume').onclick=()=>{state='PLAY';show('');};
$('bQuit').onclick=()=>{bank+=runCoins;runCoins=0;save();updMenu();show('menu');};
$('btnPause').onclick=()=>{if(state==='PLAY'){state='PAUSE';show('pause');}};
$('bRevive').onclick=()=>{reviveUsed=true;state='PLAY';
 obs.forEach(o=>{if(o.g.visible)o.g.position.z-=40;});bars.forEach(b=>{if(b.g.visible)b.g.position.z-=40;});
 show('');tone(500,1000,.3,'sine',.3);};
const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);
 const dt=Math.min(clock.getDelta(),.05);
 if(state==='PLAY'){
  speed=Math.min(34,speed+dt*.35);dist+=speed*dt;
  score=Math.floor(dist*mult)+runCoins*5;
  laneX=lerp(laneX,LANES[lane],1-Math.pow(.0001,dt));
  if(jumping){vy-=24*dt;py+=vy*dt;if(py<=0){py=0;vy=0;jumping=false;}}
  if(slideT>0)slideT-=dt;
  ph+=speed*dt*.55;
  A.position.set(laneX,py,0);
  /* === poses: every axis explicitly set => no residual spin === */
  if(slideT>0){A.rotation.set(-.9,0,0);
   legL.rotation.x=-1.2;legR.rotation.x=-1.0;armL.rotation.x=.5;armR.rotation.x=.5;
   hairG.rotation.set(.25,0,0);}
  else if(jumping){A.rotation.set(-.05,0,0);
   legL.rotation.x=-.55;legR.rotation.x=-.35;armL.rotation.x=-1.1;armR.rotation.x=-1.1;
   hairG.rotation.set(.18,0,0);}
  else{A.rotation.set(-.06-Math.min(.12,speed*.004),0,0);
   legL.rotation.x=Math.sin(ph)*.9;legR.rotation.x=-Math.sin(ph)*.9;
   armL.rotation.x=-Math.sin(ph)*.7;armR.rotation.x=Math.sin(ph)*.7;
   hairG.rotation.set(Math.sin(ph)*.08+.05,0,Math.sin(ph*.5)*.04);}
  A.position.y=py+(jumping||slideT>0?0:Math.abs(Math.sin(ph))*.06);
  railTex.offset.y-=speed*dt*.06;wallTex.offset.x-=speed*dt*.05;
  pillars.forEach(p=>{p.position.z+=speed*dt;if(p.position.z>8)p.position.z-=140;});
  lamps.forEach(l=>{l.position.z+=speed*dt;if(l.position.z>6)l.position.z-=144;});
  spawnZ+=speed*dt;
  if(spawnZ>0){
   const F=clamp(lastFree+irand(-1,1),0,2);lastFree=F;
   const others=[0,1,2].filter(l=>l!==F);
   const r=Math.random();
   if(r<.5){const lanes=Math.random()<.55?others:[others[irand(0,1)]];
    for(const L of lanes){const o=obs.find(o=>!o.g.visible);
     if(o){o.g.visible=true;o.g.position.set(LANES[L],0,-95);
      for(const c of cState)if(c.on&&Math.abs(c.x-LANES[L])<.6&&c.z<-78&&c.z>-112)c.on=false;}}}
   else if(r<.8){const L=others[irand(0,1)];
    const b=bars.find(b=>!b.g.visible);if(b){b.g.visible=true;b.g.position.set(LANES[L],0,-95);
     const hi=Math.random()<.5;b.low.visible=!hi;b.hi.visible=hi;b.type=hi?'hi':'low';}}
   if(Math.random()<.85){const n=irand(4,7),arch=Math.random()<.3;
    for(let k=0;k<n;k++){const c=cState.find(c=>!c.on);
     if(c){c.on=true;c.x=LANES[F];c.z=-93-k*2.2;c.y=arch?1+Math.sin(k/n*Math.PI)*1.6:1;}}}
   spawnZ=-rand(22,32);}
  pupZ+=speed*dt;
  if(pupZ>0){pupZ=-rand(30,50);if(owns.magnet){const p=pups.find(p=>!p.on);if(p){p.on=true;p.m.visible=true;
   p.m.position.set(LANES[lastFree],1.1,-95);}}}
  for(const o of obs)if(o.g.visible){o.g.position.z+=speed*dt;if(o.g.position.z>12)o.g.visible=false;}
  for(const b of bars)if(b.g.visible){b.g.position.z+=speed*dt;if(b.g.position.z>10)b.g.visible=false;}
  for(const p of pups)if(p.on){p.m.position.z+=speed*dt;p.m.rotation.y+=dt*3;p.m.rotation.x+=dt*2;
   if(p.m.position.z>8){p.on=false;p.m.visible=false;}}
  for(const c of cState)if(c.on){c.z+=speed*dt;c.ph+=dt*4;
   if(magnetT>0){const dx=laneX-c.x,dy=py+1-c.y,dz=-c.z,d=Math.hypot(dx,dy,dz);
    if(d<8){c.x+=dx*dt*6;c.y+=dy*dt*6;c.z+=dz*dt*6;}}
   if(c.z>6)c.on=false;
   else if(Math.abs(c.z)<1&&Math.abs(c.x-laneX)<.9&&Math.abs(c.y-(py+1))<1.3){c.on=false;runCoins++;
    tone(900,1500,.08,'sine',.2);}}
  for(let i=0;i<CD;i++){const c=cState[i];
   dummy.position.set(c.x,c.on?c.y+Math.sin(c.ph)*.08:-6,c.z);
   dummy.rotation.set(0,c.ph,0);dummy.scale.setScalar(c.on?1:.001);
   dummy.updateMatrix();coins.setMatrixAt(i,dummy.matrix);}
  coins.instanceMatrix.needsUpdate=true;
  for(const p of pups)if(p.on&&Math.abs(p.m.position.z)<1&&Math.abs(p.m.position.x-laneX)<1){
   p.on=false;p.m.visible=false;magnetT=8;tone(500,1400,.3,'sine',.3);}
  if(magnetT>0)magnetT-=dt;
  for(const o of obs)if(o.g.visible&&Math.abs(o.g.position.z)<o.len/2+.4&&Math.abs(o.g.position.x-laneX)<1.2){crash();break;}
  if(state==='PLAY')for(const b of bars)if(b.g.visible&&Math.abs(b.g.position.z)<.6&&Math.abs(b.g.position.x-laneX)<1){
   if(b.type==='low'){if(py<.85)crash();}else{if(slideT<=0&&py<1.2)crash();}break;}
  $('sc').textContent=score;$('cn').textContent=runCoins;
  $('pows').innerHTML=(magnetT>0?`<div>🧲 ${Math.ceil(magnetT)}s</div>`:'')+(shield>0?`<div>🛡 ${shield}</div>`:'')+(mult>1?`<div>⭐x2</div>`:'');
  camera.position.lerp(new THREE.Vector3(laneX*.45,3.1+py*.35,6.4),1-Math.pow(.001,dt));
  camera.lookAt(laneX*.6,1.4+py*.5,-4);
 }else if(state==='MENU'){
  ph+=dt*3;A.position.set(0,Math.abs(Math.sin(ph))*.05,0);
  A.rotation.set(0,Math.sin(ph*.3)*.3,0);
  legL.rotation.x=Math.sin(ph)*.5;legR.rotation.x=-Math.sin(ph)*.5;
  armL.rotation.x=-Math.sin(ph)*.4;armR.rotation.x=Math.sin(ph)*.4;
  hairG.rotation.set(Math.sin(ph)*.06,0,0);
  camera.position.set(0,1.8,4.2);camera.lookAt(0,1.1,0);}
 renderer.render(scene,camera);}
updMenu();show('menu');loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
}
/* ---- loader ---- */
(function(){
 if(window.THREE){bootGame();return;}
 var C=['three.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
  'https://unpkg.com/three@0.128.0/build/three.min.js'];
 var booted=false,errs=0;
 function boot(){if(!booted&&window.THREE){booted=true;try{bootGame();}catch(e){}}}
 function fail(){if(booted)return;
  document.getElementById('eng').innerHTML='❌ موتور بازی دانلود نشد — اینترنت رو چک کن و دوباره بزن';}
 C.forEach(function(u){var s=document.createElement('script');s.src=u;
  s.onload=boot;s.onerror=function(){errs++;if(errs>=C.length)fail();};
  document.head.appendChild(s);});
 var iv=setInterval(boot,250);
 setTimeout(function(){clearInterval(iv);if(!booted&&!window.THREE)fail();},25000);
})();
</script>
</body>
