<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0a0618"/>
<title>BLITZ RUN ∞</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0a0618;touch-action:none;
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;
 color:#fff;text-align:center;overflow:auto;
 background:linear-gradient(130deg,#0a0618,#2a0a3a 30%,#0a2a4a 60%,#0a0618);background-size:300% 300%;
 animation:bgm 9s ease infinite}
@keyframes bgm{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.ov:before{content:'';position:fixed;inset:0;pointer-events:none;
 background:radial-gradient(80% 60% at 50% 0%,rgba(255,95,162,.18),transparent 60%),
 radial-gradient(60% 50% at 20% 90%,rgba(95,208,255,.15),transparent 60%)}
.ov>*{position:relative}
#menu h1{font-size:clamp(34px,9.5vw,74px);margin:0;font-weight:900;letter-spacing:.04em;font-style:italic;
 background:linear-gradient(90deg,#5fd0ff,#ff5fa2,#ffd76a,#5fd0ff);background-size:300% 100%;
 -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
 animation:hue 5s linear infinite;filter:drop-shadow(0 4px 22px rgba(95,208,255,.4))}
@keyframes hue{to{background-position:300% 0}}
#menu .badge{display:inline-block;margin:10px auto;padding:7px 20px;border-radius:30px;font-weight:800;letter-spacing:.12em;
 background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(10px);font-size:13px}
.stats{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;justify-content:center}
.pill{padding:8px 16px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
 backdrop-filter:blur(12px);font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.maps{display:flex;gap:8px;margin:6px 0}
.map{padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.08);border:2px solid transparent;
 backdrop-filter:blur(10px);font-weight:900;font-size:12px;cursor:pointer;letter-spacing:.06em}
.map.sel{border-color:#ffd76a;background:rgba(255,215,106,.18);box-shadow:0 0 16px rgba(255,215,106,.35)}
.btn{margin:5px;padding:14px 40px;border-radius:28px;border:none;font-size:16px;font-weight:900;letter-spacing:.12em;cursor:pointer;
 color:#fff;background:linear-gradient(90deg,#ff2f7e,#ff7a3d);box-shadow:0 10px 30px rgba(255,47,126,.4);transition:transform .12s}
.btn:active{transform:scale(.94)}
.btn.alt{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);box-shadow:none;backdrop-filter:blur(12px)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#menu .free{margin-top:12px;font-size:10px;letter-spacing:.25em;opacity:.65}
#hud{position:fixed;z-index:15;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;display:none;
 justify-content:space-between;padding:0 16px;color:#fff;pointer-events:none}
#hud .s{font:900 22px monospace;text-shadow:0 2px 8px #000;font-variant-numeric:tabular-nums}
#hud .c{font:800 16px monospace;color:#ffd76a;text-shadow:0 2px 8px #000}
#btnPause{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.3);
 background:rgba(0,0,0,.35);backdrop-filter:blur(8px);color:#fff;font-size:17px}
#pows{position:fixed;z-index:15;top:calc(env(safe-area-inset-top,0px) + 64px);left:16px;display:none;gap:6px;flex-wrap:wrap}
#pows div{padding:5px 10px;border-radius:12px;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);font:800 12px monospace;color:#5fd0ff}
.panel{display:none;z-index:30;background:rgba(10,6,24,.94)}
.panel h2{font-size:26px;font-weight:900;font-style:italic;margin:6px 0;letter-spacing:.06em;color:#ffd76a}
#shopList,#setList{width:min(440px,92vw);max-height:50vh;overflow:auto;padding:4px}
.item{display:flex;align-items:center;gap:10px;margin:8px 0;padding:12px;border-radius:16px;
 background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);text-align:left}
.item .ic{font-size:30px}
.item .tx{flex:1;color:#fff}
.item .tx b{display:block;font-size:14px}
.item .tx span{font-size:10.5px;opacity:.7;line-height:1.4}
.item button{padding:9px 14px;border-radius:12px;border:none;font-weight:900;font-size:12px;cursor:pointer;color:#fff;
 background:linear-gradient(90deg,#ff2f7e,#ff7a3d);white-space:nowrap}
.item button:disabled{background:rgba(255,255,255,.14);color:rgba(255,255,255,.5)}
.item button.own{background:rgba(95,208,255,.25);color:#5fd0ff}
.setrow{display:flex;align-items:center;justify-content:space-between;margin:10px 0;padding:14px;border-radius:16px;
 background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#fff;font-weight:800;font-size:14px}
.setrow button{padding:9px 18px;border-radius:12px;border:none;font-weight:900;cursor:pointer;color:#fff;
 background:linear-gradient(90deg,#3a8ad9,#5fd0ff)}
#guideTxt{width:min(440px,92vw);max-height:52vh;overflow:auto;color:#fff;font-size:13px;line-height:2;text-align:right;padding:8px}
#over{display:none;z-index:30;background:rgba(10,6,24,.9)}
#over h2{font-size:clamp(36px,10vw,64px);font-weight:900;font-style:italic;margin:0;color:#ff5fa2;text-shadow:0 4px 24px rgba(255,95,162,.5)}
#pause{display:none;z-index:30;background:rgba(10,6,24,.85)}
.big{font:900 26px monospace;color:#ffd76a;margin:8px}
#zoneL,#zoneR{position:fixed;bottom:0;height:100%;z-index:5;display:none}
#zoneL{left:0;width:42%}#zoneR{right:0;width:58%}
body.touch #zoneL,body.touch #zoneR{display:block}
#sb,#sk{position:fixed;z-index:11;border-radius:50%;display:none;pointer-events:none}
#sb{width:112px;height:112px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08)}
#sk{width:52px;height:52px;background:rgba(255,255,255,.45)}
#hint{bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:12px;font:10px monospace;opacity:.6;position:fixed;z-index:15;color:#fff}
body.touch #hint{display:none}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud"><div><div class="s" id="sc">0</div><div class="c">🪙 <span id="cn">0</span></div></div>
 <button id="btnPause">⏸</button></div>
<div id="pows"></div>

<div class="ov" id="menu">
 <h1>BLITZ RUN</h1>
 <div class="badge">‍♂ RUNNER: MAX RYDER</div>
 <div class="stats"><div class="pill">🏆 <span id="mBest">0</span></div><div class="pill">🪙 <span id="mCoins">0</span></div><div class="pill">🏃 <span id="mRuns">0</span> runs</div></div>
 <div class="maps">
  <div class="map" data-m="metro">🚇 METRO</div>
  <div class="map" data-m="beach">🏖 BEACH</div>
  <div class="map" data-m="city">🌆 CITY</div>
 </div>
 <button class="btn" id="bPlay">▶ PLAY</button>
 <div class="btnrow">
  <button class="btn alt" id="bShop">🛍 SHOP</button>
  <button class="btn alt" id="bSet">⚙ SETTINGS</button>
  <button class="btn alt" id="bGuide">📖 GUIDE</button>
 </div>
 <div class="pill" id="eng" style="margin-top:10px">⏳ در حال دانلود موتور بازی…</div>
 <div class="free">100% FREE · NO ADS · SWIPE TO RUN</div>
</div>

<div class="ov panel" id="shop">
 <h2>🛍 SHOP</h2>
 <div class="pill" style="margin-bottom:6px">🪙 <span id="sCoins">0</span></div>
 <div id="shopList"></div>
 <button class="btn alt" id="bBack">← BACK</button>
</div>

<div class="ov panel" id="set">
 <h2>⚙ SETTINGS</h2>
 <div id="setList"></div>
 <button class="btn alt" id="bBack2">← BACK</button>
</div>

<div class="ov panel" id="guide">
 <h2>📖 GUIDE</h2>
 <div id="guideTxt"></div>
 <button class="btn alt" id="bBack3">← BACK</button>
</div>

<div class="ov" id="over">
 <h2>GAME OVER</h2>
 <div class="big">⭐ <span id="oScore">0</span></div>
 <div class="pill">🪙 +<span id="oCoins">0</span></div>
 <div class="pill" style="margin-top:6px">🏆 BEST: <span id="oBest">0</span></div>
 <button class="btn" id="bRetry">↻ RETRY</button>
 <button class="btn alt" id="bRevive" style="display:none">💖 REVIVE (1)</button>
 <button class="btn alt" id="bMenu">🏠 MENU</button>
</div>

<div class="ov" id="pause">
 <h2 style="font-style:italic;font-weight:900">PAUSED</h2>
 <button class="btn" id="bResume">▶ RESUME</button>
 <button class="btn alt" id="bQuit">🏠 MENU</button>
</div>

<div id="zoneL"></div><div id="zoneR"></div><div id="sb"></div><div id="sk"></div>
<div id="hint">WASD/arrows move · Space/W jump · S slide · swipe on mobile</div>

<script>
function bootGame(){'use strict';
document.getElementById('eng').style.display='none';
const rand=(a,b)=>a+Math.random()*(b-a),irand=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const isTouch=matchMedia('(pointer:coarse)').matches||'ontouchstart'in window;
if(isTouch)document.body.classList.add('touch');
let bank=+(localStorage.getItem('rr_coins')||0),best=+(localStorage.getItem('rr_best')||0),
 runs=+(localStorage.getItem('rr_runs')||0),
 owns=JSON.parse(localStorage.getItem('rr_own')||'{}'),
 set=JSON.parse(localStorage.getItem('rr_set')||'{"sound":1,"qual":1,"cam":0}');
const MAP=localStorage.getItem('rr_map')||'metro';
const save=()=>{localStorage.setItem('rr_coins',bank);localStorage.setItem('rr_best',best);
 localStorage.setItem('rr_runs',runs);localStorage.setItem('rr_own',JSON.stringify(owns));
 localStorage.setItem('rr_set',JSON.stringify(set));};
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),antialias:!isTouch&&set.qual});
renderer.setPixelRatio(set.qual?Math.min(devicePixelRatio||1,2):1);
renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function tex(c){const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;return t;}
function groundMetro(){const c=cv(128,128),g=c.getContext('2d');g.fillStyle='#3a3540';g.fillRect(0,0,128,128);
 g.fillStyle='#2a2530';for(let y=0;y<128;y+=16)g.fillRect(0,y,128,6);
 g.fillStyle='#6a6472';g.fillRect(30,0,8,128);g.fillRect(90,0,8,128);
 g.fillStyle='#8a8494';g.fillRect(32,0,3,128);g.fillRect(92,0,3,128);const t=tex(c);t.repeat.set(3,14);return t;}
function groundBeach(){const c=cv(128,128),g=c.getContext('2d');g.fillStyle='#e8d8a8';g.fillRect(0,0,128,128);
 for(let k=0;k<300;k++){g.fillStyle=`rgba(${200+rand(-20,20)|0},${180+rand(-20,20)|0},140,.5)`;g.fillRect(rand(0,128),rand(0,128),2,2);}
 g.fillStyle='#b08858';for(let y=0;y<128;y+=16)g.fillRect(40,y,48,14);
 g.fillStyle='#8a6838';for(let y=0;y<128;y+=16)g.fillRect(40,y+13,48,2);const t=tex(c);t.repeat.set(3,14);return t;}
function groundCity(){const c=cv(128,128),g=c.getContext('2d');g.fillStyle='#3a3a42';g.fillRect(0,0,128,128);
 for(let k=0;k<200;k++){g.fillStyle='rgba(255,255,255,.05)';g.fillRect(rand(0,128),rand(0,128),2,2);}
 g.fillStyle='#c8c8c0';for(let y=0;y<128;y+=24)g.fillRect(62,y,4,14);
 g.fillStyle='#e8e8e0';g.fillRect(6,0,3,128);g.fillRect(119,0,3,128);const t=tex(c);t.repeat.set(3,14);return t;}
function wallMetro(){const c=cv(256,64),g=c.getContext('2d');g.fillStyle='#4a4054';g.fillRect(0,0,256,64);
 const cols=['#ff5fa2','#5fd0ff','#ffd76a','#7cff6b'];
 for(let k=0;k<8;k++){g.fillStyle=cols[irand(0,3)];g.font='bold '+irand(14,26)+'px Arial';
  g.fillText(['BLITZ RUN','OUTLAW','MAX RYDER','★'][irand(0,3)],rand(0,200),rand(20,54));}
 g.fillStyle='rgba(0,0,0,.3)';for(let x=0;x<256;x+=32)g.fillRect(x,0,3,64);const t=tex(c);t.repeat.set(6,1);return t;}
function wallBeach(){const c=cv(256,64),g=c.getContext('2d');g.fillStyle='#c8a878';g.fillRect(0,0,256,64);
 for(let y=0;y<64;y+=10){g.fillStyle=`rgba(${160+rand(-20,20)|0},${120+rand(-15,15)|0},80,.6)`;g.fillRect(0,y,256,8);}
 g.fillStyle='#ff5fa2';g.font='bold 22px Arial';g.fillText('BEACH RUN ★',60,40);
 g.fillStyle='#5fd0ff';g.fillText('☀',200,30);const t=tex(c);t.repeat.set(6,1);return t;}
function wallCity(){const c=cv(256,64),g=c.getContext('2d');g.fillStyle='#50506a';g.fillRect(0,0,256,64);
 for(let x=0;x<256;x+=16)for(let y=0;y<64;y+=16){g.fillStyle=Math.random()<.4?'#ffe9a0':'#2a2a3a';g.fillRect(x+3,y+3,10,10);}
 const t=tex(c);t.repeat.set(6,1);return t;}
function trainTex(col){const c=cv(256,64),g=c.getContext('2d');
 g.fillStyle=col;g.fillRect(0,0,256,64);
 g.fillStyle='rgba(0,0,0,.28)';g.fillRect(0,0,256,6);g.fillRect(0,58,256,6);
 g.fillStyle='#1a222c';g.fillRect(8,14,240,16);
 g.fillStyle='rgba(160,200,255,.28)';for(let x=8;x<248;x+=20)g.fillRect(x,14,6,16);
 g.fillStyle='rgba(0,0,0,.2)';g.fillRect(52,10,34,44);g.fillRect(170,10,34,44);
 g.fillStyle='#1a222c';g.fillRect(56,14,26,14);g.fillRect(174,14,26,14);
 g.fillStyle='rgba(255,255,255,.55)';g.fillRect(0,34,256,3);return tex(c);}
const THEMES={
 metro:{sky:0x1a1026,fog:0x1a1026,hemi:[0xbfc8ff,0x2a2030],g:groundMetro,w:wallMetro,
  veh:['#ffc42e','#d94040','#3a6ad9','#4caf7d'],decor:'pillars',lamp:0xffe9b0},
 beach:{sky:0x8fd8ff,fog:0xcfe8f0,hemi:[0xdff4ff,0xc8b080],g:groundBeach,w:wallBeach,
  veh:['#f8f8f8','#19b8c8','#ff8866','#ffd76a'],decor:'palms',lamp:0xfff8e0},
 city:{sky:0x2a1a3a,fog:0x3a2a4a,hemi:[0xd0b0ff,0x303040],g:groundCity,w:wallCity,
  veh:['#d94040','#3a6ad9','#888898','#ff8c3a'],decor:'buildings',lamp:0xffe9b0}};
const TH=THEMES[MAP];
scene.background=new THREE.Color(TH.sky);scene.fog=new THREE.Fog(TH.fog,30,95);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,200);
scene.add(new THREE.HemisphereLight(TH.hemi[0],TH.hemi[1],.9));
const dl=new THREE.DirectionalLight(0xfff0d8,.8);dl.position.set(4,10,6);scene.add(dl);
const groundMat=new THREE.MeshStandardMaterial({map:TH.g(),roughness:1});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(9,140),groundMat);
ground.rotation.x=-Math.PI/2;ground.position.z=-40;scene.add(ground);
for(const s of[-1,1]){const w=new THREE.Mesh(new THREE.BoxGeometry(.6,4,140),new THREE.MeshStandardMaterial({map:TH.w()}));
 w.position.set(s*4.6,2,-40);scene.add(w);}
const waters=[];
if(MAP==='beach')for(const s of[-1,1]){const w=new THREE.Mesh(new THREE.PlaneGeometry(60,140),
 new THREE.MeshStandardMaterial({color:0x19a8c8,transparent:true,opacity:.8,roughness:.3}));
 w.rotation.x=-Math.PI/2;w.position.set(s*36,-.4,-40);scene.add(w);waters.push(w);}
function mergeGeo(list,cols){let cnt=0;for(const o of list)cnt+=o.g.attributes.position.count;
 const pos=new Float32Array(cnt*3),nor=new Float32Array(cnt*3),col=new Float32Array(cnt*3);
 const v=new THREE.Vector3(),c=new THREE.Color(),m=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler();let o3=0;
 list.forEach((o,ii)=>{e.set(o.r?o.r[0]:0,o.r?o.r[1]:0,o.r?o.r[2]:0);q.setFromEuler(e);
  m.compose(new THREE.Vector3(o.p?o.p[0]:0,o.p?o.p[1]:0,o.p?o.p[2]:0),q,new THREE.Vector3(1,1,1));
  c.set(cols[ii]);const P=o.g.attributes.position,N=o.g.attributes.normal;
  for(let i=0;i<P.count;i++){v.fromBufferAttribute(P,i).applyMatrix4(m);pos[o3+i*3]=v.x;pos[o3+i*3+1]=v.y;pos[o3+i*3+2]=v.z;
   v.fromBufferAttribute(N,i).applyQuaternion(q);nor[o3+i*3]=v.x;nor[o3+i*3+1]=v.y;nor[o3+i*3+2]=v.z;
   col[o3+i*3]=c.r;col[o3+i*3+1]=c.g;col[o3+i*3+2]=c.b;}
  o3+=P.count*3;});
 const g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.BufferAttribute(pos,3));
 g.setAttribute('normal',new THREE.BufferAttribute(nor,3));
 g.setAttribute('color',new THREE.BufferAttribute(col,3));return g;}
const BX=(w,h,d)=>new THREE.BoxGeometry(w,h,d).toNonIndexed();
const CY=(r,h,s)=>new THREE.CylinderGeometry(r,r,h,s||6).toNonIndexed();
const pillars=[],lampsArr=[];
if(TH.decor==='pillars'){
 for(let i=0;i<10;i++)for(const s of[-1,1]){
  const p=new THREE.Mesh(BX(.5,4.4,.5),new THREE.MeshStandardMaterial({color:0x6a5a7a}));
  p.position.set(s*4.1,2.2,-i*14);scene.add(p);pillars.push(p);}
 for(let i=0;i<8;i++){const l=new THREE.Mesh(BX(6,.15,.4),new THREE.MeshBasicMaterial({color:TH.lamp}));
  l.position.set(0,4.3,-i*18);scene.add(l);lampsArr.push(l);}}
else if(TH.decor==='palms'){
 const palmG=mergeGeo([{g:CY(.16,3.4,6),p:[0,1.7,0]},
  {g:new THREE.ConeGeometry(.3,2.4,4).toNonIndexed(),p:[0,3.6,.6],r:[1.1,0,0]},
  {g:new THREE.ConeGeometry(.3,2.4,4).toNonIndexed(),p:[0,3.6,-.6],r:[-1.1,0,0]},
  {g:new THREE.ConeGeometry(.3,2.4,4).toNonIndexed(),p:[.6,3.6,0],r:[0,0,-1.1]},
  {g:new THREE.ConeGeometry(.3,2.4,4).toNonIndexed(),p:[-.6,3.6,0],r:[0,0,1.1]}],
  [0x8a6a44,0x2f8f3a,0x2f8f3a,0x3a9a44,0x3a9a44]);
 const im=new THREE.InstancedMesh(palmG,new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true}),24);
 const d=new THREE.Object3D();let k=0;
 for(let i=0;i<12;i++)for(const s of[-1,1]){d.position.set(s*rand(6.5,8),0,-i*12);d.rotation.y=rand(0,6);
  const sc=rand(.8,1.3);d.scale.set(sc,sc,sc);d.updateMatrix();im.setMatrixAt(k++,d.matrix);}
 im.frustumCulled=false;scene.add(im);
 const umbG=mergeGeo([{g:CY(.06,2.4,6),p:[0,1.2,0]},
  {g:new THREE.ConeGeometry(1.3,.7,8).toNonIndexed(),p:[0,2.5,0]}],[0xe8e8e8,0xff4060]);
 const umbG2=mergeGeo([{g:CY(.06,2.4,6),p:[0,1.2,0]},
  {g:new THREE.ConeGeometry(1.3,.7,8).toNonIndexed(),p:[0,2.5,0]}],[0xe8e8e8,0x30b0ff]);
 const u1=new THREE.InstancedMesh(umbG,new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true}),10);
 const u2=new THREE.InstancedMesh(umbG2,new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true}),10);
 for(let i=0;i<10;i++){d.position.set((i%2?1:-1)*rand(6.5,9),0,-i*13-4);d.rotation.y=rand(0,6);d.scale.set(1,1,1);
